name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Buildozer
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Init and Build APK
        run: |
          buildozer init
          sed -i 's/title = My Application/title = EgyptHeritage/g' buildozer.spec
          sed -i 's/package.name = myapp/package.name = egyptheritage/g' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,plyer,arabic-reshaper,python-bidi/g' buildozer.spec
          sed -i 's/#android.api = 31/android.api = 33/g' buildozer.spec
          sed -i 's/#android.sdk = 31/android.sdk = 33/g' buildozer.spec
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EgyptHeritage-APK
          path: bin/*.apk
