name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install --user --upgrade buildozer cython==0.29.36

      - name: Initialize buildozer.spec
        run: |
          yes | buildozer init
          sed -i 's/title = My Application/title = EgyptHeritage/g' buildozer.spec
          sed -i 's/package.name = myapp/package.name = egyptheritage/g' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,plyer,arabic-reshaper,python-bidi/g' buildozer.spec
          sed -i 's/#android.permissions = INTERNET/android.permissions = INTERNET,ACCESS_FINE_LOCATION,ACCESS_COARSE_LOCATION/g' buildozer.spec

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EgyptHeritage-APK
          path: bin/*.apk
